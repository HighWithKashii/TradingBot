# /etc/watchdog.conf -- Hardware-Watchdog-Konfiguration fuer den Trading-Bot-Pi.
#
# Schuetzt gegen einen kompletten System-Freeze (Kernel haengt, kein
# Interrupt-Handling mehr) -- in dem Fall kann selbst dieser watchdog-Daemon
# nicht mehr laufen/pingen, und genau dafuer ist der bcm2835_wdt-Hardware-
# Watchdog des Pi da: bekommt das Geraet /dev/watchdog laenger als
# watchdog-timeout Sekunden KEIN Ping, loest die SoC-Hardware selbststaendig
# einen Reset aus, unabhaengig vom Kernel-Zustand.
#
# Bewusst schlank gehalten: Anwendungs-Health (laeuft der Bot-Prozess,
# Alpaca erreichbar, Tailscale verbunden, Speicherplatz, RAM) wird separat
# per healthcheck.sh alle 5 Minuten via Cron geprueft und dort auch aktiv
# behoben -- das hier ist NUR das letzte Sicherheitsnetz gegen einen
# Totalausfall, bei dem gar nichts mehr reagiert.

# Geraetedatei des Hardware-Watchdogs (bcm2835_wdt-Kernelmodul)
watchdog-device = /dev/watchdog

# Kein Reset mehr moeglich, wenn der Daemon laenger als 15s keinen Ping
# schickt -- reine Hardware-Ebene, arbeitet auch bei komplett eingefrorenem
# Kernel/Interrupt-Handling.
watchdog-timeout = 15

# Der Daemon selbst prueft/pingt alle 10s -- deutlich unter dem 15s-Timeout,
# damit unter normaler Last (z.B. kurzzeitig hohe CPU-Last durch pandas/
# Backtest) kein falscher Alarm ausgeloest wird.
interval = 10

# Absichtlich KEINE zusaetzlichen Anwendungs-Checks hier (kein max-load-1,
# kein min-memory, keine ping-Liste, keine test-binary) -- das wuerde sich
# mit healthcheck.sh ueberschneiden und im schlimmsten Fall zu einem
# ungewollten Hard-Reset fuehren, obwohl healthcheck.sh das Problem bereits
# kontrolliert (z.B. per Neustart des Bot-Service) behebt. Der
# Hardware-Watchdog soll ausschliesslich bei einem Total-Freeze eingreifen.

# Log-Level: 1 = normale Betriebsmeldungen (Start/Stop), keine Ping-Flut
verbose = 0
