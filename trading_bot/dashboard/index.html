<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading">
<title>Trading Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b0f14'/%3E%3Crect x='22' y='55' width='12' height='30' fill='%2300e676'/%3E%3Crect x='44' y='32' width='12' height='53' fill='%2300e676'/%3E%3Crect x='66' y='18' width='12' height='67' fill='%23ff5252'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b0f14'/%3E%3Crect x='22' y='55' width='12' height='30' fill='%2300e676'/%3E%3Crect x='44' y='32' width='12' height='53' fill='%2300e676'/%3E%3Crect x='66' y='18' width='12' height='67' fill='%23ff5252'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14;
    --bg-card: #131924;
    --bg-card-2: #1a2230;
    --border: rgba(255,255,255,0.08);
    --text: #e8ecf1;
    --text-dim: #7c8797;
    --green: #00e676;
    --red: #ff5252;
    --amber: #f5a623;
    --accent: #3b82f6;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
    overscroll-behavior-y: contain;
  }

  .container { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* --- Header --- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px 20px;
  }

  .header-title { display: flex; align-items: center; gap: 10px; }
  .header-title h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: 0.2px; }

  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(0,230,118,0.55);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  .status-dot.offline { background: var(--red); animation: none; box-shadow: none; }
  .status-dot.loading { background: var(--amber); animation: pulse-amber 1.1s infinite; }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0,230,118,0.5); }
    70%  { box-shadow: 0 0 0 9px rgba(0,230,118,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,230,118,0); }
  }
  @keyframes pulse-amber {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    padding: 8px; cursor: pointer; line-height: 0;
    border-radius: 8px;
  }
  .icon-btn:active { background: var(--bg-card); }
  .icon-btn svg { width: 22px; height: 22px; display: block; }

  /* --- Connection banner --- */
  .banner {
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(255,82,82,0.12);
    border: 1px solid rgba(255,82,82,0.35);
    color: var(--red);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .banner.show { display: flex; }
  .banner.setup { background: rgba(245,166,35,0.12); border-color: rgba(245,166,35,0.35); color: var(--amber); }

  /* --- Cards --- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }

  .mode-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    padding: 3px 9px;
    border-radius: 20px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .mode-badge.paper { background: rgba(59,130,246,0.15); color: var(--accent); }
  .mode-badge.live { background: rgba(255,82,82,0.18); color: var(--red); }

  .equity-value {
    font-family: var(--mono);
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .pl-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 15px;
  }
  .pl-row .arrow { font-size: 13px; }
  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral { color: var(--text-dim); }

  .sub-stats {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .sub-stat { text-align: left; }
  .sub-stat .label { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .sub-stat .value { font-family: var(--mono); font-size: 14px; }

  /* --- Section headings --- */
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 22px 4px 10px;
  }

  .empty-hint {
    color: var(--text-dim);
    font-size: 13px;
    padding: 14px 4px;
    text-align: center;
  }

  /* --- Positions --- */
  .position-row, .trade-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .position-row:last-child, .trade-row:last-child { border-bottom: none; }

  .row-left { min-width: 0; }
  .symbol { font-weight: 700; font-size: 15px; }
  .row-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-family: var(--mono); }

  .row-right { text-align: right; flex-shrink: 0; }
  .row-right .main-value { font-family: var(--mono); font-size: 15px; font-weight: 600; }
  .row-right .sub-value { font-family: var(--mono); font-size: 12px; margin-top: 2px; }

  /* --- Trades --- */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    margin-right: 8px;
    vertical-align: middle;
  }
  .badge.buy { background: rgba(0,230,118,0.16); color: var(--green); }
  .badge.sell { background: rgba(255,82,82,0.16); color: var(--red); }

  .trade-reason {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--mono);
    margin-top: 18px;
  }
  footer button {
    background: none; border: none; color: var(--accent);
    font-family: var(--sans); font-size: 12px; cursor: pointer; padding: 6px;
  }

  /* --- Settings modal --- */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.show { display: flex; }

  .modal {
    background: var(--bg-card-2);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.2s ease-out;
  }
  @keyframes slide-up {
    from { transform: translateY(24px); opacity: 0.6; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal h2 { font-size: 16px; margin: 0 0 4px; }
  .modal p.hint { font-size: 12px; color: var(--text-dim); margin: 0 0 18px; line-height: 1.5; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--bg-card); color: var(--text-dim); border: 1px solid var(--border); }

  .modal-status { font-size: 12px; margin-top: 10px; min-height: 16px; }
  .modal-status.ok { color: var(--green); }
  .modal-status.err { color: var(--red); }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="header-title">
      <span class="status-dot loading" id="statusDot"></span>
      <h1>Trading Dashboard</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <div class="banner" id="connBanner"></div>

  <!-- Konto-Karte -->
  <div class="card">
    <span class="mode-badge paper" id="modeBadge">–</span>
    <div class="equity-value" id="equityValue">–</div>
    <div class="pl-row" id="plRow">
      <span class="arrow"></span>
      <span id="plDollar">–</span>
      <span id="plPercent"></span>
      <span style="color:var(--text-dim); font-weight:400;">heute</span>
    </div>
    <div class="sub-stats">
      <div class="sub-stat">
        <div class="label">Cash</div>
        <div class="value" id="cashValue">–</div>
      </div>
      <div class="sub-stat">
        <div class="label">Kaufkraft</div>
        <div class="value" id="bpValue">–</div>
      </div>
    </div>
  </div>

  <!-- Positionen -->
  <div class="section-title">Offene Positionen</div>
  <div class="card" id="positionsCard">
    <div class="empty-hint" id="positionsEmpty">Keine offenen Positionen</div>
    <div id="positionsList"></div>
  </div>

  <!-- Trades -->
  <div class="section-title">Letzte Trades</div>
  <div class="card" id="tradesCard">
    <div class="empty-hint" id="tradesEmpty">Noch keine Trades</div>
    <div id="tradesList"></div>
  </div>

  <footer>
    <div id="lastUpdated">Noch keine Daten geladen</div>
    <button id="refreshBtn">Jetzt aktualisieren</button>
  </footer>

</div>

<!-- Einstellungen-Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Einstellungen</h2>
    <p class="hint">Adresse und Token deines Raspberry-Pi-Dashboard-Servers (siehe README des Bots). Wird nur lokal auf diesem Geraet gespeichert.</p>
    <div class="field">
      <label for="apiUrlInput">Server-Adresse</label>
      <input type="text" id="apiUrlInput" placeholder="z.B. http://100.x.x.x:5000" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="tokenInput">Dashboard-Token</label>
      <input type="text" id="tokenInput" placeholder="aus dashboard_token.txt auf dem Pi" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="modal-status" id="modalStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="modalCancel">Abbrechen</button>
      <button class="btn btn-primary" id="modalSave">Speichern</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "tradingDashboardConfig";
  const REFRESH_MS = 30000;
  const FETCH_TIMEOUT_MS = 8000;

  const el = (id) => document.getElementById(id);
  const dot = el("statusDot");
  const banner = el("connBanner");

  let lastGoodData = null;
  let refreshTimer = null;

  // ---------- Konfiguration (localStorage) ----------
  function loadConfig() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveConfig(cfg) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  }

  function hasConfig() {
    const cfg = loadConfig();
    return !!(cfg && cfg.apiUrl && cfg.token);
  }

  // ---------- Formatierung ----------
  const currencyFmt = new Intl.NumberFormat("de-DE", { style: "currency", currency: "USD" });
  const numberFmt = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function formatCurrency(value) {
    return currencyFmt.format(value);
  }

  function formatSignedCurrency(value) {
    const sign = value > 0 ? "+" : value < 0 ? "" : "±";
    return sign + currencyFmt.format(value);
  }

  function formatSignedPercent(value) {
    const sign = value > 0 ? "+" : value < 0 ? "" : "±";
    return `(${sign}${numberFmt.format(value)} %)`;
  }

  function plClass(value) {
    if (value > 0) return "positive";
    if (value < 0) return "negative";
    return "neutral";
  }

  function formatTimestamp(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      return iso;
    }
  }

  // ---------- Rendering ----------
  function renderAccount(data) {
    const badge = el("modeBadge");
    badge.textContent = data.mode === "live" ? "Live" : "Paper";
    badge.className = "mode-badge " + (data.mode === "live" ? "live" : "paper");

    el("equityValue").textContent = formatCurrency(data.account.equity);
    el("cashValue").textContent = formatCurrency(data.account.cash);
    el("bpValue").textContent = formatCurrency(data.account.buying_power);

    const plDollar = data.account.day_pl_dollar;
    const plPercent = data.account.day_pl_percent;
    const cls = plClass(plDollar);
    const plRow = el("plRow");
    plRow.querySelector(".arrow").textContent = plDollar > 0 ? "▲" : plDollar < 0 ? "▼" : "•";
    plRow.querySelector(".arrow").className = "arrow " + cls;
    const plDollarEl = el("plDollar");
    plDollarEl.textContent = formatSignedCurrency(plDollar);
    plDollarEl.className = cls;
    const plPercentEl = el("plPercent");
    plPercentEl.textContent = formatSignedPercent(plPercent);
    plPercentEl.className = cls;
  }

  function renderPositions(positions) {
    const list = el("positionsList");
    const empty = el("positionsEmpty");
    list.innerHTML = "";

    if (!positions || positions.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    positions.forEach((p) => {
      const row = document.createElement("div");
      row.className = "position-row";
      const cls = plClass(p.unrealized_pl);
      row.innerHTML = `
        <div class="row-left">
          <div class="symbol">${escapeHtml(p.symbol)}</div>
          <div class="row-sub">${numberFmt.format(p.qty)} Stk. @ ${formatCurrency(p.avg_entry_price)}</div>
        </div>
        <div class="row-right">
          <div class="main-value ${cls}">${formatSignedCurrency(p.unrealized_pl)}</div>
          <div class="sub-value ${cls}">${formatSignedPercent(p.unrealized_pl_percent)}</div>
        </div>`;
      list.appendChild(row);
    });
  }

  function renderTrades(trades) {
    const list = el("tradesList");
    const empty = el("tradesEmpty");
    list.innerHTML = "";

    if (!trades || trades.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    trades.forEach((t) => {
      const row = document.createElement("div");
      row.className = "trade-row";
      const isBuy = t.action === "BUY";
      row.innerHTML = `
        <div class="row-left">
          <div>
            <span class="badge ${isBuy ? "buy" : "sell"}">${isBuy ? "BUY" : "SELL"}</span>
            <span class="symbol">${escapeHtml(t.symbol)}</span>
          </div>
          <div class="trade-reason">${escapeHtml(t.reason || "")}</div>
        </div>
        <div class="row-right">
          <div class="main-value">${formatCurrency(t.price)}</div>
          <div class="sub-value" style="color:var(--text-dim)">${formatTimestamp(t.timestamp)}</div>
        </div>`;
      list.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Verbindungsstatus ----------
  function setStatus(state, message) {
    // state: "ok" | "loading" | "error"
    dot.className = "status-dot" + (state === "ok" ? "" : state === "loading" ? " loading" : " offline");

    if (state === "ok") {
      banner.className = "banner";
      banner.textContent = "";
      return;
    }
    banner.className = "banner show" + (state === "loading" ? " setup" : "");
    banner.textContent = message;
  }

  function setLastUpdated(text) {
    el("lastUpdated").textContent = text;
  }

  // ---------- Datenabruf ----------
  async function fetchStatus() {
    if (!hasConfig()) {
      setStatus("error", "⚙️ Noch nicht eingerichtet — bitte Server-Adresse und Token in den Einstellungen eintragen.");
      setLastUpdated("Nicht konfiguriert");
      return;
    }

    const cfg = loadConfig();
    const url = cfg.apiUrl.replace(/\/+$/, "") + "/api/status";

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

    try {
      const res = await fetch(url, {
        headers: { "X-Dashboard-Token": cfg.token },
        signal: controller.signal,
      });
      clearTimeout(timeout);

      if (res.status === 401) {
        setStatus("error", "🔒 Ungueltiges Dashboard-Token. Bitte in den Einstellungen pruefen.");
        return;
      }
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).error || ""; } catch (e) {}
        setStatus("error", `⚠️ Serverfehler (${res.status})${detail ? ": " + detail : ""}`);
        return;
      }

      const data = await res.json();
      lastGoodData = data;
      renderAccount(data);
      renderPositions(data.positions);
      renderTrades(data.recent_trades);
      setStatus("ok");
      setLastUpdated("Aktualisiert: " + new Date().toLocaleTimeString("de-DE"));
    } catch (err) {
      clearTimeout(timeout);
      setStatus(
        "error",
        "📡 Keine Verbindung zum Server. Ist der Raspberry Pi erreichbar (Tailscale aktiv)?"
      );
      if (lastGoodData) {
        setLastUpdated(
          "Letzte Daten von " + new Date().toLocaleTimeString("de-DE") + " (Verbindung unterbrochen)"
        );
      } else {
        setLastUpdated("Keine Daten verfuegbar");
      }
    }
  }

  function startPolling() {
    if (refreshTimer) clearInterval(refreshTimer);
    fetchStatus();
    refreshTimer = setInterval(fetchStatus, REFRESH_MS);
  }

  // ---------- Einstellungen-Modal ----------
  function openModal() {
    const cfg = loadConfig() || {};
    el("apiUrlInput").value = cfg.apiUrl || "";
    el("tokenInput").value = cfg.token || "";
    el("modalStatus").textContent = "";
    el("modalStatus").className = "modal-status";
    el("modalBackdrop").classList.add("show");
  }

  function closeModal() {
    el("modalBackdrop").classList.remove("show");
  }

  function saveSettings() {
    const apiUrl = el("apiUrlInput").value.trim();
    const token = el("tokenInput").value.trim();
    const statusEl = el("modalStatus");

    if (!apiUrl || !token) {
      statusEl.textContent = "Bitte beide Felder ausfuellen.";
      statusEl.className = "modal-status err";
      return;
    }

    saveConfig({ apiUrl, token });
    statusEl.textContent = "Gespeichert.";
    statusEl.className = "modal-status ok";
    setTimeout(() => {
      closeModal();
      startPolling();
    }, 400);
  }

  // ---------- Event-Listener ----------
  el("settingsBtn").addEventListener("click", openModal);
  el("modalCancel").addEventListener("click", closeModal);
  el("modalSave").addEventListener("click", saveSettings);
  el("modalBackdrop").addEventListener("click", (e) => {
    if (e.target === el("modalBackdrop")) closeModal();
  });
  el("refreshBtn").addEventListener("click", fetchStatus);

  // ---------- Start ----------
  if (!hasConfig()) {
    openModal();
