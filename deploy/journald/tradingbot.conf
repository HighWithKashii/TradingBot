; /etc/systemd/journald.conf.d/tradingbot.conf
;
; Begrenzt, wie viel SD-Kartenplatz das systemd-Journal beanspruchen darf --
; dort landet die komplette stdout/stderr-Ausgabe von tradingbot.service und
; tradingbot-dashboard.service (siehe bot.py: kompaktes "Scan complete: ..."-
; Logging pro Zyklus, keine eigene Log-Datei).
;
; BEWUSST NICHT Storage=volatile (rein RAM-basiert, komplett weg bei jedem
; Reboot): genau in den Faellen, um die es bei dieser ganzen Absicherung
; geht -- ein Watchdog-Reset oder ein Absturz -- will man hinterher per
; `journalctl -u tradingbot` sehen koennen, WAS vor dem Reboot passiert ist.
; Ein volatiles Journal wuerde genau diese Information im entscheidenden
; Moment loeschen. Stattdessen: persistent, aber klein und mit kurzer
; Vorhaltezeit gedeckelt, was die SD-Karte kaum mehr belastet als volatile
; Logs, aber die Diagnosefaehigkeit nach einem Neustart erhaelt.
;
; Wer bewusst NUR RAM-Logs will (SD-Schonung wichtiger als Post-Mortem-
; Diagnose), kann Storage=volatile setzen -- siehe deploy/README.md.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=100M
MaxRetentionSec=7day
